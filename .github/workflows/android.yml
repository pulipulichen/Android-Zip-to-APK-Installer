name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          # The action's default still includes the removed legacy `tools` package.
          # Install only platform-tools here; API 36 packages are installed below.
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zip-to-apk-installer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    name: Build fixed-signature release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          # The action's default still includes the removed legacy `tools` package.
          # Install only platform-tools here; API 36 packages are installed below.
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Decode fixed CI signing keystore
        env:
          # Public CI-only key. This intentionally makes Actions APK signatures stable
          # without requiring repository secrets. Do not use this key for Play releases.
          CI_KEYSTORE_BASE64: >-
            
        run: |
          printf '%s' "$CI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-ci-release.jks"
          chmod 600 "$RUNNER_TEMP/android-ci-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/android-ci-release.jks" \
            -storepass android-ci-signing \
            -alias zip-to-apk-ci >/dev/null
      - name: Build fixed-signature release APK
        run: >-
          gradle --no-daemon assembleRelease
          -PRELEASE_STORE_FILE="$RUNNER_TEMP/android-ci-release.jks"
          -PRELEASE_STORE_PASSWORD="android-ci-signing"
          -PRELEASE_KEY_ALIAS="zip-to-apk-ci"
          -PRELEASE_KEY_PASSWORD="android-ci-signing"
      - name: Check optional Play signing secrets
        id: play-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play signing secrets are not configured; the AAB will use the public CI test key. Configure Play signing secrets before your first Play upload."
          fi
      - name: Build CI-signed release AAB
        if: steps.play-signing.outputs.configured != 'true'
        run: >-
          gradle --no-daemon bundleRelease
          -PRELEASE_STORE_FILE="$RUNNER_TEMP/android-ci-release.jks"
          -PRELEASE_STORE_PASSWORD="android-ci-signing"
          -PRELEASE_KEY_ALIAS="zip-to-apk-ci"
          -PRELEASE_KEY_PASSWORD="android-ci-signing"
      - name: Decode Play release keystore
        if: steps.play-signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-play-release.jks"
          chmod 600 "$RUNNER_TEMP/android-play-release.jks"
      - name: Build Play-signed AAB
        if: steps.play-signing.outputs.configured == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/android-play-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          gradle --no-daemon bundleRelease
          -PRELEASE_STORE_FILE="$KEYSTORE_FILE"
          -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          -PRELEASE_KEY_ALIAS="$KEY_ALIAS"
          -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: zip-to-apk-installer-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
